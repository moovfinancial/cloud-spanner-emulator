# Builds the patched emulator image for amd64 and arm64 on native runners and
# publishes one multi-arch tag to GHCR. The moov branch is upstream plus our
# patches; a laptop job merges upstream into it, and each push rebuilds.
name: Moov image

on:
  push:
    branches: [moov]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: moov-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/moovfinancial/cloud-spanner-emulator

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        run: |
          version=$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 --match 'v*')
          tag="${version#v}-moov-${GITHUB_SHA::8}"
          docker buildx imagetools create \
            -t "$IMAGE:$tag" \
            -t "$IMAGE:${version#v}-moov" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          echo "Published $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
