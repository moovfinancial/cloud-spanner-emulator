# Builds the patched emulator image for amd64 and arm64 on native runners and
# publishes one multi-arch tag to Artifact Registry (moov-gar/apps). The moov branch is upstream plus our
# patches; a laptop job merges upstream into it, and each push rebuilds.
name: Moov image

on:
  push:
    branches: [moov]
    # Workflow-only commits do not change the image.
    paths-ignore: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: moov-image
  cancel-in-progress: false

env:
  IMAGE: us-docker.pkg.dev/moov-gar/apps/cloud-spanner-emulator

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # The generated GoogleSQL sources need several GB each in GCC. Four at
      # once runs the 16 GB hosted runners out of memory (on amd64 the runner
      # is shut down mid-compile).
      - name: Limit Bazel parallelism
        run: echo 'build --jobs=2' >> .bazelrc

      # Anonymous Docker Hub pulls hit 429s on shared runners.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      # Build first, then authenticate and push. The access token lasts an
      # hour and a cold build takes several, so a token taken before the
      # build has expired by the push. The push build reuses the layers of
      # the first build from the local builder.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Tag the multi-arch image
        working-directory: /tmp/digests
        run: |
          version=$(git -C "$GITHUB_WORKSPACE" describe --tags --abbrev=0 --match 'v*')
          tag="${version#v}-moov-${GITHUB_SHA::8}"
          docker buildx imagetools create \
            -t "$IMAGE:$tag" \
            -t "$IMAGE:${version#v}-moov" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          echo "Published $IMAGE:$tag" >> "$GITHUB_STEP_SUMMARY"
