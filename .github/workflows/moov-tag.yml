# Tags images that a "Moov image" run already pushed by digest, without a
# rebuild. Use it when one platform build failed and another succeeded, or to
# re-point a tag. digests: space-separated sha256 hex values, one per platform.
# source: the registry the digests are in; the result is always in GAR.
name: Moov tag

on:
  workflow_dispatch:
    inputs:
      digests:
        description: Space-separated sha256 digests (hex only), one per platform
        required: true
      tag:
        description: Extra tag besides latest, for example 1.5.58-moov-ba3189a3
        required: true
      source:
        description: Image the digests belong to
        required: true
        default: us-docker.pkg.dev/moov-gar/apps/cloud-spanner-emulator

permissions:
  contents: read
  id-token: write
  packages: read

env:
  IMAGE: us-docker.pkg.dev/moov-gar/apps/cloud-spanner-emulator

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3

      - id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        env:
          DIGESTS: ${{ inputs.digests }}
          TAG: ${{ inputs.tag }}
          SOURCE: ${{ inputs.source }}
        run: |
          refs=""
          for d in $DIGESTS; do refs="$refs $SOURCE@sha256:${d#sha256:}"; done
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" $refs
          docker buildx imagetools inspect "$IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
