# Builds an amd64 test image for a perf/** branch and tags it perf-<sha>.
# It never moves latest, so service CI is unaffected until a PR opts in.
name: Moov perf image

on:
  push:
    branches: ["perf/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: moov-perf-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: us-docker.pkg.dev/moov-gar/apps/cloud-spanner-emulator

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/docker/Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:perf-${{ github.sha }}
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=perf-linux/amd64

      - run: echo "Published $IMAGE:perf-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
